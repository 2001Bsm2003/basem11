<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>إدارة البرج</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f7f7;color:#173b3a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.header{background:#0f766e;color:#fff;padding:26px 18px 24px;border-radius:0 0 28px 28px;display:flex;justify-content:space-between;gap:16px;align-items:center}
.title h1{margin:0;font-size:34px}.title p{margin:7px 0 0;font-size:18px;opacity:.9}
.header-actions{display:flex;gap:8px;flex-wrap:wrap}
.header-actions button{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35);padding:12px 16px;border-radius:16px}
.wrap{max-width:1000px;margin:auto;padding:18px}
.card{background:#fff;border:1px solid #dce8e7;border-radius:22px;padding:18px;margin-bottom:16px;box-shadow:0 3px 12px rgba(0,0,0,.04)}
h2{margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
label{display:block;font-weight:700;margin-bottom:6px}
input,select,textarea{width:100%;padding:13px;border:1px solid #cbdad9;border-radius:13px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:#0f766e}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.primary{background:#0f766e;color:#fff;padding:12px 18px;border-radius:13px}
.secondary{background:#e8f0ff;color:#18519a;padding:12px 18px;border-radius:13px}
.green{background:#e4f7ef;color:#087744;padding:12px 18px;border-radius:13px}
.yellow{background:#fff4d8;color:#805d00;padding:12px 18px;border-radius:13px}
.red{background:#ffe9e7;color:#b42318;padding:12px 18px;border-radius:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#fff;border:1px solid #dce8e7;border-radius:18px;padding:14px;text-align:center}
.stat b{font-size:26px;display:block;color:#0f766e}
.search{margin-bottom:16px}
.subscriber{background:#fff;border:2px solid #dce8e7;border-radius:22px;padding:18px;margin-bottom:14px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.name{font-size:24px;font-weight:800}
.badge{padding:8px 13px;border-radius:999px;background:#e3f7ed;color:#087744;font-weight:800}
.badge.unpaid{background:#fff0e8;color:#b54708}
.info{line-height:1.9;color:#49615f;margin-top:8px}
.small{font-size:14px;color:#657b79}
.receipt{display:none;background:#fffdf4;border:2px dashed #d4b35c;border-radius:18px;padding:16px;margin-top:12px}
.receipt.show{display:block}
.receipt h3{margin-top:0}
.notice{padding:12px 14px;border-radius:13px;background:#eef8f7;color:#17615e;margin-bottom:12px}
.empty{text-align:center;padding:28px;color:#687d7b}
@media(max-width:650px){.header{align-items:flex-start}.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr 1fr}.title h1{font-size:29px}.name{font-size:21px}}
</style>
</head>
<body>
<header class="header">
  <div class="title">
    <h1>إدارة البرج 📡</h1>
    <p>نظام إدارة المشتركين والتسديدات</p>
  </div>
  <div class="header-actions">
    <button onclick="backupData()">💾 نسخ احتياطي</button>
    <button onclick="document.getElementById('restoreInput').click()">📥 استرجاع</button>
    <input id="restoreInput" type="file" accept=".json,application/json" hidden onchange="restoreData(event)">
  </div>
</header>

<main class="wrap">
  <section class="card">
    <h2 id="formTitle">➕ إضافة مشترك</h2>
    <div class="grid">
      <div><label>اسم المشترك</label><input id="name" placeholder="مثال: أحمد محمد"></div>
      <div><label>رقم الهاتف</label><input id="phone" inputmode="tel" placeholder="078xxxxxxxx"></div>
      <div><label>الحساب</label><input id="account" placeholder="مثال: ahmed@bs"></div>
      <div><label>الباقة</label><input id="package" placeholder="مثال: 30 ميغا"></div>
      <div><label>المبلغ</label><input id="amount" type="number" min="0" placeholder="35000"></div>
      <div><label>تاريخ انتهاء الاشتراك</label><input id="expiry" type="date"></div>
    </div>
    <div class="actions">
      <button class="primary" onclick="saveSubscriber()">💾 حفظ المشترك</button>
      <button class="secondary" onclick="clearForm()">↩️ إلغاء</button>
    </div>
    <input id="editId" type="hidden">
  </section>

  <section class="stats">
    <div class="stat"><span>المشتركون</span><b id="countAll">0</b></div>
    <div class="stat"><span>مسددون</span><b id="countPaid">0</b></div>
    <div class="stat"><span>غير مسددين</span><b id="countUnpaid">0</b></div>
  </section>

  <section class="card">
    <input class="search" id="search" placeholder="🔎 ابحث بالاسم أو الهاتف أو الحساب..." oninput="render()">
    <div id="list"></div>
  </section>
</main>

<script>
const KEY="idar_al_burj_subscribers_v3";
let subscribers=JSON.parse(localStorage.getItem(KEY)||"[]");

function saveDB(){localStorage.setItem(KEY,JSON.stringify(subscribers));}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function money(v){return Number(v||0).toLocaleString("ar-IQ")+" د.ع";}
function normalizePhone(p){
  let x=String(p||"").replace(/[^\d+]/g,"");
  if(x.startsWith("00964")) x="+"+x.slice(2);
  if(x.startsWith("964")) x="+"+x;
  if(x.startsWith("07")) x="+964"+x.slice(1);
  return x;
}
function wa(phone,text){
  const n=normalizePhone(phone).replace("+","");
  if(!n){alert("لا يوجد رقم هاتف لهذا المشترك");return;}
  location.href="https://wa.me/"+n+"?text="+encodeURIComponent(text);
}
function daysLeft(expiry){
  if(!expiry)return "";
  const a=new Date(); a.setHours(0,0,0,0);
  const b=new Date(expiry+"T00:00:00");
  return Math.ceil((b-a)/86400000);
}
function receiptText(s){
  return `إيصال تسديد - إدارة البرج%0Aالمشترك: ${s.name}%0Aالمبلغ: ${money(s.amount)}%0Aالحالة: تم تسديد المبلغ ✅%0Aتاريخ التسديد: ${s.paidAt||""}%0Aتاريخ انتهاء الاشتراك: ${s.expiry||""}%0Aرقم الإيصال: ${s.receiptNo||""}`;
}
function reminderText(s){
  const d=daysLeft(s.expiry);
  return `السلام عليكم ${s.name}%0Aنود تنبيهكم بأن اشتراك الإنترنت سينتهي بتاريخ ${s.expiry}، والمتبقي ${d} يوم.%0Aإدارة البرج 📡`;
}
function saveSubscriber(){
  const name=document.getElementById("name").value.trim();
  const phone=document.getElementById("phone").value.trim();
  const account=document.getElementById("account").value.trim();
  const packageName=document.getElementById("package").value.trim();
  const amount=document.getElementById("amount").value;
  const expiry=document.getElementById("expiry").value;
  if(!name||!phone||!amount||!expiry){alert("يرجى إدخال الاسم ورقم الهاتف والمبلغ وتاريخ الانتهاء");return;}
  const id=document.getElementById("editId").value;
  if(id){
    const s=subscribers.find(x=>x.id===id);
    if(s){s.name=name;s.phone=phone;s.account=account;s.package=packageName;s.amount=amount;s.expiry=expiry;}
  }else{
    subscribers.unshift({id:Date.now().toString(),name,phone,account,package:packageName,amount,expiry,paid:false});
  }
  saveDB();clearForm();render();alert("تم حفظ المشترك بنجاح ✅");
}
function editSubscriber(id){
  const s=subscribers.find(x=>x.id===id); if(!s)return;
  document.getElementById("editId").value=s.id;
  document.getElementById("name").value=s.name||"";
  document.getElementById("phone").value=s.phone||"";
  document.getElementById("account").value=s.account||"";
  document.getElementById("package").value=s.package||"";
  document.getElementById("amount").value=s.amount||"";
  document.getElementById("expiry").value=s.expiry||"";
  document.getElementById("formTitle").textContent="✏️ تعديل المشترك";
  scrollTo({top:0,behavior:"smooth"});
}
function clearForm(){
  document.querySelectorAll("#name,#phone,#account,#package,#amount,#expiry").forEach(e=>e.value="");
  document.getElementById("editId").value="";
  document.getElementById("formTitle").textContent="➕ إضافة مشترك";
}
function markPaid(id){
  const s=subscribers.find(x=>x.id===id); if(!s)return;
  s.paid=true;s.paidAt=new Date().toLocaleDateString("ar-IQ");s.receiptNo="R-"+Date.now().toString().slice(-7);
  saveDB();render();
}
function cancelPaid(id){
  const s=subscribers.find(x=>x.id===id); if(!s)return;
  s.paid=false;s.paidAt="";s.receiptNo="";
  saveDB();render();
}
function deleteSubscriber(id){
  if(!confirm("حذف هذا المشترك؟"))return;
  subscribers=subscribers.filter(x=>x.id!==id);saveDB();render();
}
function showReceipt(id){
  const el=document.getElementById("receipt-"+id);
  if(el)el.classList.toggle("show");
}
function render(){
  const q=document.getElementById("search").value.trim().toLowerCase();
  const filtered=subscribers.filter(s=>(s.name+" "+s.phone+" "+s.account).toLowerCase().includes(q));
  document.getElementById("countAll").textContent=subscribers.length;
  document.getElementById("countPaid").textContent=subscribers.filter(s=>s.paid).length;
  document.getElementById("countUnpaid").textContent=subscribers.filter(s=>!s.paid).length;
  const list=document.getElementById("list");
  if(!filtered.length){list.innerHTML='<div class="empty">لا توجد مشتركين.</div>';return;}
  list.innerHTML=filtered.map(s=>{
    const d=daysLeft(s.expiry);
    const status=s.paid?'<span class="badge">مسدد ✓</span>':'<span class="badge unpaid">غير مسدد</span>';
    return `<article class="subscriber">
      <div class="top"><div class="name">${esc(s.name)}</div>${status}</div>
      <div class="info">
        📱 ${esc(s.phone)}<br>
        👤 الحساب: ${esc(s.account||"-")}<br>
        📶 الباقة: ${esc(s.package||"-")}<br>
        💰 ${money(s.amount)}<br>
        📅 ${esc(s.expiry)}<br>
        ⏱️ ${d<0?"منتهي":d+" يوم متبقي"}
      </div>
      <div class="actions">
        ${s.paid
          ? `<button class="secondary" onclick="cancelPaid('${s.id}')">إلغاء التسديد</button>
             <button class="yellow" onclick="showReceipt('${s.id}')">🧾 عرض الإيصال</button>
             <button class="green" onclick="wa('${esc(s.phone)}','${receiptText(s)}')">📲 إرسال الإيصال واتساب</button>`
          : `<button class="green" onclick="wa('${esc(s.phone)}','${reminderText(s)}')">💬 تنبيه واتساب</button>
             <button class="yellow" onclick="showReceipt('${s.id}')">🧾 إيصال</button>
             <button class="primary" onclick="markPaid('${s.id}')">✅ تم تسديد المبلغ</button>`
        }
        <button class="secondary" onclick="editSubscriber('${s.id}')">✏️ تعديل</button>
        <button class="red" onclick="deleteSubscriber('${s.id}')">🗑️ حذف</button>
      </div>
      <div class="receipt" id="receipt-${s.id}">
        <h3>🧾 إيصال التسديد</h3>
        <div>رقم الإيصال: <b>${esc(s.receiptNo||"غير مسدد")}</b></div>
        <div>المشترك: <b>${esc(s.name)}</b></div>
        <div>الهاتف: <b>${esc(s.phone)}</b></div>
        <div>المبلغ: <b>${money(s.amount)}</b></div>
        <div>الحالة: <b>${s.paid?"تم تسديد المبلغ ✅":"غير مسدد"}</b></div>
        <div>تاريخ التسديد: <b>${esc(s.paidAt||"-")}</b></div>
        <div>الانتهاء: <b>${esc(s.expiry)}</b></div>
      </div>
    </article>`;
  }).join("");
}
function backupData(){
  const blob=new Blob([JSON.stringify(subscribers,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="idar-al-burj-backup.json";a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function restoreData(e){
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=()=>{try{const data=JSON.parse(r.result);if(!Array.isArray(data))throw 0;subscribers=data;saveDB();render();alert("تم الاسترجاع بنجاح ✅");}catch{alert("ملف النسخة الاحتياطية غير صحيح");}};
  r.readAsText(file);
}
render();
</script>
</body>
</html>
