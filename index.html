<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>إدارة البرج</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f7f7;color:#243238;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.container{max-width:1000px;margin:auto;padding:18px}
.header{background:#0f766e;color:#fff;padding:22px 18px;border-radius:0 0 24px 24px;box-shadow:0 4px 15px #0002}
.headerRow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{font-size:31px;font-weight:800}
.subtitle{font-size:16px;opacity:.95;margin-top:5px}
.headerBtns{display:flex;gap:8px;flex-wrap:wrap}
.smallBtn{background:#ffffff22;color:#fff;border:1px solid #ffffff55;padding:10px 13px;border-radius:13px}
.card{background:#fff;border:1px solid #dbe7e7;border-radius:20px;padding:18px;margin:16px 0;box-shadow:0 2px 8px #0000000b}
h2,h3{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(max-width:650px){.grid{grid-template-columns:1fr}.headerRow{align-items:flex-start;flex-direction:column}}
label{display:block;font-weight:700;margin-bottom:6px}
input,select,textarea{width:100%;padding:13px;border:1px solid #cfdcdc;border-radius:12px;background:#fff;outline:none}
input:focus,textarea:focus{border-color:#0f766e;box-shadow:0 0 0 3px #0f766e18}
textarea{min-height:90px;resize:vertical}
.primary{background:#0f766e;color:#fff;padding:12px 17px;border-radius:12px;font-weight:800}
.secondary{background:#eaf1ff;color:#174ea6;padding:12px 17px;border-radius:12px;font-weight:800}
.success{background:#e6f7ef;color:#087443;padding:12px 17px;border-radius:12px;font-weight:800}
.warning{background:#fff4d8;color:#805d00;padding:12px 17px;border-radius:12px;font-weight:800}
.danger{background:#ffeded;color:#b42318;padding:12px 17px;border-radius:12px;font-weight:800}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:#fff;border:1px solid #dbe7e7;border-radius:16px;padding:14px;text-align:center}
.stat b{display:block;font-size:24px;color:#0f766e}
.stat span{font-size:13px;color:#607174}
.search{margin-bottom:12px}
.subscriber{background:#fff;border:1px solid #dbe7e7;border-radius:20px;padding:17px;margin:13px 0;box-shadow:0 2px 8px #00000009}
.subTop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.name{font-size:21px;font-weight:900}
.badge{display:inline-block;padding:7px 11px;border-radius:999px;font-weight:800;font-size:13px}
.paidBadge{background:#e1f7ed;color:#087443}
.unpaidBadge{background:#fff0f0;color:#b42318}
.info{margin:12px 0;line-height:1.9;color:#506064}
.info div{margin:2px 0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{flex:1 1 130px}
.receipt{margin-top:12px;background:#f8fbfb;border:1px dashed #9bb8b8;border-radius:16px;padding:15px}
.receiptTitle{text-align:center;font-size:20px;font-weight:900;color:#0f766e;margin-bottom:10px}
.receiptLine{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #e2ecec}
.receiptLine:last-child{border-bottom:0}
.muted{color:#6b7b7e}
.empty{text-align:center;padding:35px;color:#718083}
.notice{background:#fff7df;border:1px solid #efd994;color:#6e5600;padding:13px;border-radius:14px;margin:12px 0}
.footer{text-align:center;color:#718083;padding:20px;font-size:12px}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:20}
.modal.show{display:flex}
.modalBox{width:min(700px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:22px;padding:18px}
.modalHead{display:flex;justify-content:space-between;align-items:center}
.close{background:#eee;border-radius:50%;width:40px;height:40px;font-size:22px}
hr{border:0;border-top:1px solid #e5eeee;margin:18px 0}
</style>
</head>
<body>

<header class="header">
  <div class="container" style="padding:0">
    <div class="headerRow">
      <div>
        <div class="logo">إدارة البرج 📡</div>
        <div class="subtitle">نظام إدارة المشتركين والتسديدات</div>
      </div>
      <div class="headerBtns">
        <button class="smallBtn" onclick="backupData()">💾 نسخ احتياطي</button>
        <button class="smallBtn" onclick="document.getElementById('restoreInput').click()">📥 استرجاع</button>
        <input id="restoreInput" type="file" accept=".json,application/json" style="display:none" onchange="restoreData(event)">
      </div>
    </div>
  </div>
</header>

<main class="container">

<section class="stats">
  <div class="stat"><b id="totalCount">0</b><span>كل المشتركين</span></div>
  <div class="stat"><b id="paidCount">0</b><span>مسدد</span></div>
  <div class="stat"><b id="unpaidCount">0</b><span>غير مسدد</span></div>
  <div class="stat"><b id="expiringCount">0</b><span>ينتهي قريباً</span></div>
</section>

<section class="card">
  <h2>➕ إضافة مشترك</h2>
  <div class="grid">
    <div>
      <label>اسم المشترك</label>
      <input id="name" placeholder="مثال: عمر سلام">
    </div>
    <div>
      <label>رقم الهاتف</label>
      <input id="phone" inputmode="tel" placeholder="077xxxxxxxx">
    </div>
    <div>
      <label>الحساب</label>
      <input id="account" placeholder="مثال: omarss@bs">
    </div>
    <div>
      <label>الباقة</label>
      <input id="plan" value="30 ميغا" placeholder="مثال: 30 ميغا">
    </div>
    <div>
      <label>المبلغ</label>
      <input id="amount" type="number" min="0" placeholder="35000">
    </div>
    <div>
      <label>تاريخ انتهاء الاشتراك</label>
      <input id="expiry" type="date">
    </div>
  </div>
  <div class="row" style="margin-top:14px">
    <button class="primary" onclick="addSubscriber()">➕ حفظ المشترك</button>
    <button class="secondary" onclick="clearForm()">مسح الحقول</button>
  </div>
</section>

<section class="card">
  <h2>📋 المشتركين</h2>
  <input class="search" id="search" placeholder="🔎 ابحث بالاسم أو الرقم أو الحساب..." oninput="render()">
  <div class="row" style="margin-bottom:12px">
    <button class="secondary" onclick="setFilter('all')">الكل</button>
    <button class="success" onclick="setFilter('paid')">مسدد</button>
    <button class="warning" onclick="setFilter('unpaid')">غير مسدد</button>
    <button class="danger" onclick="setFilter('expiring')">قريب الانتهاء</button>
  </div>
  <div id="list"></div>
</section>

<section class="card">
  <h2>💬 رسالة التنبيه</h2>
  <p class="muted">يمكنك تعديل النص، وسيتم استخدامه عند الضغط على «تنبيه واتساب».</p>
  <textarea id="reminderTemplate">السلام عليكم {name}، نود تنبيهك بأن اشتراكك في برج الإنترنت سينتهي بتاريخ {expiry}. المتبقي {days} يوم. يرجى التجديد لتجنب انقطاع الخدمة. شكراً لكم.</textarea>
  <div class="row" style="margin-top:10px">
    <button class="primary" onclick="saveTemplate()">💾 حفظ الرسالة</button>
  </div>
</section>

<div class="footer">إدارة البرج — البيانات محفوظة على هذا الجهاز.</div>
</main>

<div id="modal" class="modal">
  <div class="modalBox">
    <div class="modalHead">
      <h2 id="modalTitle">إيصال الدفع</h2>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <div id="modalContent"></div>
  </div>
</div>

<script>
const KEY="tower_management_subscribers_v3";
const TEMPLATE_KEY="tower_management_reminder_template_v3";
let subscribers=JSON.parse(localStorage.getItem(KEY)||"[]");
let filter="all";

function save(){localStorage.setItem(KEY,JSON.stringify(subscribers));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function money(n){return Number(n||0).toLocaleString("ar-IQ")+" د.ع";}
function today(){return new Date().toISOString().slice(0,10);}
function daysLeft(date){
  if(!date)return null;
  const a=new Date(); a.setHours(0,0,0,0);
  const b=new Date(date+"T00:00:00"); 
  return Math.ceil((b-a)/86400000);
}
function formatDate(date){
  if(!date)return "-";
  const d=new Date(date+"T00:00:00");
  return d.toLocaleDateString("ar-IQ",{year:"numeric",month:"2-digit",day:"2-digit"});
}
function normalizePhone(phone){
  let p=String(phone||"").replace(/[^\d+]/g,"");
  if(p.startsWith("00"))p="+"+p.slice(2);
  if(p.startsWith("0"))p="+964"+p.slice(1);
  if(!p.startsWith("+"))p="+"+p;
  return p.replace("+","");
}
function waUrl(phone,text){
  return "https://wa.me/"+normalizePhone(phone)+"?text="+encodeURIComponent(text);
}
function messageTemplate(s){
  let days=daysLeft(s.expiry);
  let t=document.getElementById("reminderTemplate").value;
  return t.replaceAll("{name}",s.name||"")
    .replaceAll("{expiry}",formatDate(s.expiry))
    .replaceAll("{days}",String(days===null?"":days))
    .replaceAll("{amount}",money(s.amount));
}
function receiptText(s){
  return "إيصال تسديد - إدارة البرج\n"+
    "رقم الإيصال: "+(s.receiptNo||"-")+"\n"+
    "المشترك: "+s.name+"\n"+
    "الهاتف: "+s.phone+"\n"+
    "الحساب: "+(s.account||"-")+"\n"+
    "الباقة: "+(s.plan||"-")+"\n"+
    "المبلغ: "+money(s.amount)+"\n"+
    "حالة التسديد: تم تسديد المبلغ ✅\n"+
    "تاريخ التسديد: "+formatDate(s.paidAt)+"\n"+
    "تاريخ انتهاء الاشتراك: "+formatDate(s.expiry)+"\n\n"+
    "شكراً لتسديدكم، نتمنى لكم خدمة مستقرة.";
}
function setFilter(f){filter=f;render();}
function clearForm(){
  ["name","phone","account","plan","amount","expiry"].forEach(id=>document.getElementById(id).value=id==="plan"?"30 ميغا":"");
}
function addSubscriber(){
  const s={
    id:uid(),
    name:document.getElementById("name").value.trim(),
    phone:document.getElementById("phone").value.trim(),
    account:document.getElementById("account").value.trim(),
    plan:document.getElementById("plan").value.trim(),
    amount:Number(document.getElementById("amount").value||0),
    expiry:document.getElementById("expiry").value,
    paid:false,
    paidAt:"",
    receiptNo:""
  };
  if(!s.name){alert("اكتب اسم المشترك");return;}
  if(!s.phone){alert("اكتب رقم الهاتف");return;}
  if(!s.expiry){alert("اختر تاريخ انتهاء الاشتراك");return;}
  subscribers.unshift(s);save();clearForm();render();
  alert("تم حفظ المشترك بنجاح ✅");
}
function markPaid(id){
  const s=subscribers.find(x=>x.id===id); if(!s)return;
  if(s.paid){showReceipt(id);return;}
  s.paid=true;
  s.paidAt=today();
  s.receiptNo="BR-"+new Date().getTime().toString().slice(-8);
  save();render();showReceipt(id);
}
function cancelPaid(id){
  const s=subscribers.find(x=>x.id===id); if(!s)return;
  if(confirm("هل تريد إلغاء حالة التسديد؟")){
    s.paid=false;s.paidAt="";s.receiptNo="";save();render();
  }
}
function deleteSubscriber(id){
  if(!confirm("حذف هذا المشترك نهائياً؟"))return;
  subscribers=subscribers.filter(x=>x.id!==id);save();render();
}
function editSubscriber(id){
  const s=subscribers.find(x=>x.id===id); if(!s)return;
  document.getElementById("name").value=s.name||"";
  document.getElementById("phone").value=s.phone||"";
  document.getElementById("account").value=s.account||"";
  document.getElementById("plan").value=s.plan||"";
  document.getElementById("amount").value=s.amount||"";
  document.getElementById("expiry").value=s.expiry||"";
  subscribers=subscribers.filter(x=>x.id!==id);save();render();
  window.scrollTo({top:0,behavior:"smooth"});
}
function showReceipt(id){
  const s=subscribers.find(x=>x.id===id); if(!s)return;
  document.getElementById("modalTitle").textContent="🧾 إيصال التسديد";
  document.getElementById("modalContent").innerHTML=
    '<div class="receipt">'+
    '<div class="receiptTitle">إدارة البرج 📡</div>'+
    '<div class="receiptLine"><b>رقم الإيصال</b><span>'+esc(s.receiptNo)+'</span></div>'+
    '<div class="receiptLine"><b>المشترك</b><span>'+esc(s.name)+'</span></div>'+
    '<div class="receiptLine"><b>الهاتف</b><span>'+esc(s.phone)+'</span></div>'+
    '<div class="receiptLine"><b>الحساب</b><span>'+esc(s.account||"-")+'</span></div>'+
    '<div class="receiptLine"><b>الباقة</b><span>'+esc(s.plan||"-")+'</span></div>'+
    '<div class="receiptLine"><b>المبلغ</b><span>'+money(s.amount)+'</span></div>'+
    '<div class="receiptLine"><b>الحالة</b><span style="color:#087443;font-weight:900">تم تسديد المبلغ ✅</span></div>'+
    '<div class="receiptLine"><b>تاريخ التسديد</b><span>'+formatDate(s.paidAt)+'</span></div>'+
    '<div class="receiptLine"><b>الانتهاء</b><span>'+formatDate(s.expiry)+'</span></div>'+
    '</div>'+
    '<div class="row" style="margin-top:14px">'+
    '<button class="success" onclick="sendReceiptWhatsApp(\''+s.id+'\')">📲 إرسال الإيصال واتساب</button>'+
    '<button class="secondary" onclick="window.print()">🖨️ طباعة</button>'+
    '</div>';
  document.getElementById("modal").classList.add("show");
}
function sendReceiptWhatsApp(id){
  const s=subscribers.find(x=>x.id===id); if(!s)return;
  if(!s.paid){alert("يجب تسجيل التسديد أولاً");return;}
  window.open(waUrl(s.phone,receiptText(s)),"_blank");
}
function sendReminder(id){
  const s=subscribers.find(x=>x.id===id); if(!s)return;
  window.open(waUrl(s.phone,messageTemplate(s)),"_blank");
}
function saveTemplate(){
  localStorage.setItem(TEMPLATE_KEY,document.getElementById("reminderTemplate").value);
  alert("تم حفظ رسالة التنبيه ✅");
}
function backupData(){
  const data={version:3,exportedAt:new Date().toISOString(),subscribers,template:document.getElementById("reminderTemplate").value};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download="tower-backup.json";a.click();
  URL.revokeObjectURL(a.href);
}
function restoreData(e){
  const file=e.target.files[0]; if(!file)return;
  const r=new FileReader();
  r.onload=function(){
    try{
      const data=JSON.parse(r.result);
      if(!Array.isArray(data.subscribers))throw new Error();
      subscribers=data.subscribers;save();
      if(data.template)document.getElementById("reminderTemplate").value=data.template;
      render();alert("تم استرجاع النسخة الاحتياطية ✅");
    }catch(err){alert("ملف النسخة الاحتياطية غير صالح");}
  };
  r.readAsText(file);
  e.target.value="";
}
function closeModal(){document.getElementById("modal").classList.remove("show");}
function esc(v){
  return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}
function render(){
  const q=document.getElementById("search").value.trim().toLowerCase();
  const filtered=subscribers.filter(s=>{
    const text=(s.name+" "+s.phone+" "+s.account).toLowerCase();
    if(q && !text.includes(q))return false;
    const d=daysLeft(s.expiry);
    if(filter==="paid"&&!s.paid)return false;
    if(filter==="unpaid"&&s.paid)return false;
    if(filter==="expiring"&&(d===null||d<0||d>7))return false;
    return true;
  });
  document.getElementById("totalCount").textContent=subscribers.length;
  document.getElementById("paidCount").textContent=subscribers.filter(s=>s.paid).length;
  document.getElementById("unpaidCount").textContent=subscribers.filter(s=>!s.paid).length;
  document.getElementById("expiringCount").textContent=subscribers.filter(s=>{let d=daysLeft(s.expiry);return d!==null&&d>=0&&d<=7}).length;

  const list=document.getElementById("list");
  if(!filtered.length){list.innerHTML='<div class="empty">لا توجد نتائج حالياً.</div>';return;}
  list.innerHTML=filtered.map(s=>{
    const d=daysLeft(s.expiry);
    let remaining=d===null?"-":(d<0?"منتهي":d+" يوم");
    let badge=s.paid?'<span class="badge paidBadge">مسدد ✓</span>':'<span class="badge unpaidBadge">غير مسدد</span>';
    let payButton=s.paid
      ?'<button class="secondary" onclick="cancelPaid(\''+s.id+'\')">إلغاء التسديد</button>'
      :'<button class="success" onclick="markPaid(\''+s.id+'\')">✅ تم تسديد المبلغ</button>';
    return '<div class="subscriber">'+
      '<div class="subTop"><div><div class="name">'+esc(s.name)+'</div></div>'+badge+'</div>'+
      '<div class="info">'+
      '<div>📱 '+esc(s.phone)+'</div>'+
      '<div>👤 الحساب: '+esc(s.account||"-")+'</div>'+
      '<div>📶 الباقة: '+esc(s.plan||"-")+'</div>'+
      '<div>💰 المبلغ: '+money(s.amount)+'</div>'+
      '<div>📅 '+formatDate(s.expiry)+'</div>'+
      '<div>⏱️ متبقي: '+remaining+'</div>'+
      '</div>'+
      '<div class="actions">'+
      '<button class="primary" onclick="sendReminder(\''+s.id+'\')">💬 تنبيه واتساب</button>'+
      '<button class="warning" onclick="showReceipt(\''+s.id+'\')">🧾 إيصال</button>'+
      payButton+
      '<button class="secondary" onclick="editSubscriber(\''+s.id+'\')">✏️ تعديل</button>'+
      '<button class="danger" onclick="deleteSubscriber(\''+s.id+'\')">🗑️ حذف</button>'+
      '</div>'+
      '</div>';
  }).join("");
}
(function init(){
  const saved=localStorage.getItem(TEMPLATE_KEY);
  if(saved)document.getElementById("reminderTemplate").value=saved;
  render();
})();
</script>
</body>
</html>
